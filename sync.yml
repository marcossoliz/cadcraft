name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a medianoche
  workflow_dispatch: # Permite forzar la actualización manual en cualquier momento

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        uses: dabreadman/sync-repo-action@v1.3.0
        with:
          source_repo: "storytold/cadcraft"
          source_branch: "main"
          target_branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}
